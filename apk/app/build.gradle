apply plugin: 'com.android.application'

android {
    namespace 'com.dshmini.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.dshmini.app"
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName "1.4.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug // 调试签名即可安装；正式分发可替换为自己的 keystore
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // CameraX 实时相机预览（AOSP API，免 GMS；仅扫码用，不引入 appcompat）
    def camerax = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    // 开源二维码解码（zxing-core，纯 Java，~600KB，免 GMS）
    implementation "com.google.zxing:core:3.5.3"
}
