<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d0d0d" />
<title>DSH-Mobile · 连接</title>
<style>
  :root {
    color-scheme: dark;
    --bg1:#0b0e14; --bg2:#161b26;
    --text:#f4f5f7; --muted:#9aa4b2; --faint:#6b7385;
    --accent:#5eb4ff; --ok:#8ef0b7; --err:#ff8f8f;
    --glass:rgba(255,255,255,.06); --glass-b:rgba(255,255,255,.11);
    --line:rgba(255,255,255,.10);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:var(--bg1); color:var(--text);
    font-family: ui-sans-serif,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  /* 液态玻璃：模糊环境底 + 半透层 + 高光描边 */
  .bg { position:fixed; inset:0; z-index:0; background:
      radial-gradient(1200px 700px at 15% -10%, rgba(94,180,255,.20), transparent 60%),
      radial-gradient(900px 600px at 110% 30%, rgba(142,240,183,.12), transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2)); }
  .bg::after { content:""; position:absolute; inset:0;
      background:radial-gradient(500px 300px at 80% 85%, rgba(255,255,255,.06), transparent 60%); }
  .wrap { position:relative; z-index:1; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:calc(max(env(safe-area-inset-top), var(--dsh-safe-top, 0px)) + 28px) 22px
      calc(max(env(safe-area-inset-bottom), 0px) + 28px); }
  .glass { background:var(--glass); border:1px solid var(--glass-b);
    -webkit-backdrop-filter:blur(24px) saturate(160%); backdrop-filter:blur(24px) saturate(160%);
    box-shadow:0 12px 48px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14); }
  .logo { width:76px; height:76px; border-radius:22px; display:grid; place-items:center; overflow:hidden;
    background:linear-gradient(135deg,rgba(94,180,255,.35),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.16); box-shadow:0 8px 28px rgba(94,180,255,.22),
    inset 0 1px 0 rgba(255,255,255,.2); }
  .logo img { width:100%; height:100%; object-fit:cover; }
  h1 { margin:0; font-size:21px; letter-spacing:-.02em; font-weight:700; }
  .sub { margin:0; color:var(--muted); font-size:13px; text-align:center; line-height:1.7; padding:0 10px; }
  .card { width:100%; max-width:400px; display:flex; flex-direction:column; gap:12px;
    padding:18px; border-radius:26px; }
  .btn { appearance:none; border:0; border-radius:16px; padding:15px; font:inherit;
    font-size:15px; font-weight:700; cursor:pointer; color:#0b0e14; background:linear-gradient(135deg,#7cc6ff,#4d9dff);
    box-shadow:0 8px 24px rgba(77,157,255,.35), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn:active { transform:scale(.98); }
  .btn.ghost { color:var(--text); background:var(--glass); border:1px solid var(--glass-b);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); box-shadow:inset 0 1px 0 rgba(255,255,255,.12); }
  .divider { display:flex; align-items:center; gap:10px; color:var(--faint); font-size:11px; }
  .divider::before,.divider::after { content:""; flex:1; height:1px; background:var(--line); }
  .row { display:flex; gap:8px; }
  .row input { flex:1; min-width:0; border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    background:rgba(0,0,0,.28); color:var(--text); font:inherit; font-size:14px; outline:none; }
  .row input:focus { border-color:var(--accent); }
  #status { color:var(--faint); font-size:12px; min-height:16px; text-align:center; line-height:1.5; padding:0 8px; }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--err); }
  .foot { color:var(--faint); font-size:11px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="wrap">
    <div class="logo"><img src="icon.png" alt="" /></div>
    <h1>DSH-Mobile</h1>
    <p class="sub">在电脑的 DSH 里点左下角「手机连接」图标<br />用本应用扫桌面二维码，即可遥控电脑上的 AI 会话</p>
    <div class="card glass">
      <button class="btn" id="scan" type="button">扫码连接</button>
      <div class="divider">或手动输入</div>
      <div class="row">
        <input id="url" type="url" inputmode="url" placeholder="http://IP:端口/?token=…" />
        <button class="btn ghost" id="go" type="button">连接</button>
      </div>
    </div>
    <div id="status"></div>
    <p class="foot">提示：真机点「扫码连接」调用系统相机实时识别；<br />模拟器 / 虚拟机无相机时请直接输入链接。</p>
  </div>
  <script>
  "use strict";
  // 沉浸式安全区：APK WebView 桥读状态栏高度（Android env() 不可靠恒 0）。
  // 桥返回物理像素，除以 devicePixelRatio 才是 CSS px（华为 nova7se dpr=3：108px→36px）。
  try {
    var dpr = window.devicePixelRatio || 1;
    var st = window.DshMiniBridge && window.DshMiniBridge.getSafeTop;
    var px = st ? Number(window.DshMiniBridge.getSafeTop()) : 0;
    if (px > 0) document.documentElement.style.setProperty("--dsh-safe-top", Math.round(px / dpr) + "px");
  } catch (e) { /* 无桥环境忽略 */ }
  var statusEl = document.getElementById("status");
  function say(msg, cls) { statusEl.textContent = msg; statusEl.className = cls || ""; }
  function parseTarget(text) {
    var t = String(text || "").trim();
    var u = null;
    try { u = new URL(t); } catch (e) { return null; }
    if (u.protocol !== "http:" && u.protocol !== "https:") return null;
    // v3：GUI 在网关根路径（http://IP:端口/?token=…），不再有 /dsh-mini/ 前缀
    var base = u.origin + "/";
    var token = u.searchParams.get("token");
    return base + (token ? "?token=" + encodeURIComponent(token) : "");
  }
  function connect(url) {
    if (!url) { say("未识别到有效链接", "err"); return; }
    say("连接 " + (url.length > 60 ? url.slice(0, 60) + "…" : url) + " …");
    try { if (window.DshMiniBridge) window.DshMiniBridge.connect(url); return; }
    catch (e) { /* fall through */ }
    location.href = url;
  }
  // 原生侧连通自检（file:// 页面 fetch 会被 CORS 拦，桥走 Java HttpURLConnection）
  function testThenConnect(fullUrl, rawText) {
    if (!fullUrl) { say("未识别到有效链接", "err"); return; }
    say(rawText ? "校验 " + rawText + " …" : "校验连接 …");
    document.getElementById("go").disabled = true;
    window.__dshMiniTestCb = function (ok, code, err) {
      document.getElementById("go").disabled = false;
      if (ok) {
        say("连通 ✓ 正在打开手机端…", "ok");
        setTimeout(function () { connect(fullUrl); }, 200);
      } else {
        var msg = "无法访问（HTTP " + (code || "连接失败") + "）——请检查：电脑 DSH 网关已开启(0.0.0.0)、手机与电脑同一网络、IP 是否正确、防火墙是否放行端口";
        if (err) msg += " · " + err;
        say(msg, "err");
      }
    };
    try {
      if (window.DshMiniBridge && window.DshMiniBridge.testUrl) {
        window.DshMiniBridge.testUrl(fullUrl);
        return;
      }
    } catch (e) { /* fall through */ }
    connect(fullUrl);
  }
  var urlInput = document.getElementById("url");
  // 回填上次成功连接的地址（虚拟机/换网后无需重输）
  try {
    var last = window.DshMiniBridge && window.DshMiniBridge.getLastUrl ? window.DshMiniBridge.getLastUrl() : "";
    if (last) { urlInput.value = last; say("已回填上次连接地址，直接点「连接」即可", "ok"); }
  } catch (e) { /* ignore */ }
  // Native 实时扫码：识别回调 __dshMiniScanCb(url)，失败传 (null, reason)
  window.__dshMiniScanCb = function (url, reason) {
    if (url) {
      testThenConnect(parseTarget(url), url);
    } else if (reason === "NO_CAMERA_PERMISSION") {
      say("未授予相机权限，请在系统设置中授权后重试", "err");
    } else {
      say("未识别到二维码，请对准桌面二维码重试", "err");
    }
  };
  document.getElementById("scan").onclick = function () {
    say("正在启动相机…");
    try {
      if (window.DshMiniBridge && window.DshMiniBridge.startScan) {
        window.DshMiniBridge.startScan();
        return;
      }
    } catch (e) { /* fall through */ }
    say("当前环境不支持 Native 扫码，请手动输入链接", "err");
  };
  document.getElementById("go").onclick = function () { testThenConnect(parseTarget(urlInput.value), urlInput.value); };
  urlInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") testThenConnect(parseTarget(e.target.value), e.target.value);
  });
  </script>
</body>
</html>
