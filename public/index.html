<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=overlays-content" />
  <meta name="theme-color" content="#0b0e15" />
  <meta name="application-name" content="DSH-Mobile" />
  <meta name="apple-mobile-web-app-title" content="DSH-Mobile" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" type="image/png" />
  <title>DSH-Mobile</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0d0d;
      --topbar-bg: #000000;
      --topbar-row-height: clamp(44px, 11vw, 52px);
      --topbar-safe-lift: 0px;
      --top-control-size: 26px;
      --panel: #171717;
      --panel-2: #242424;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --faint: #71717a;
      --line: rgba(255,255,255,.09);
      --user: #2f2f2f;
      --accent: #f4f4f5;
      --ok: #8ef0b7;
      --blue: #5eb4ff;
      --dsh-safe-top: 0px;
      --dsh-safe-bottom: 0px;
      --app-height: 100vh;
      --app-top: 0px;
      --keyboard-shift: 0px;
      --composer-bottom-pad: max(56px, calc(max(env(safe-area-inset-bottom), var(--dsh-safe-bottom, 0px)) + 30px));
      --composer-signature-top: calc(var(--topbar-row-height) + 10px);
      --glass-border: rgba(255,255,255,.105);
      --glass-highlight: inset 0 1px 0 rgba(255,255,255,.09);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, "PingFang SC", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      -webkit-text-size-adjust: 100%;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; margin: 0; background: #0b0e15; overflow: hidden; overscroll-behavior: none; touch-action: pan-x pan-y; letter-spacing: .01em; }
    body {
      position: fixed; inset: 0; color: var(--text);
      background: linear-gradient(172deg, #161b2a 0%, #0c101a 46%, #0e1419 100%);
    }
    /* 液态玻璃环境：固定光斑层（在 .app 之下） */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(640px 420px at 14% -8%, rgba(94,180,255,.15), transparent 56%),
        radial-gradient(520px 380px at 96% 10%, rgba(142,240,183,.09), transparent 56%),
        radial-gradient(700px 560px at 50% 114%, rgba(124,144,255,.12), transparent 60%);
      background-attachment: fixed;
    }
    .app {
      position: fixed; left: 0; right: 0; top: var(--app-top); width: 100%;
      height: 100vh;
      height: 100dvh;
      display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: transparent; z-index: 1;
    }
    .topbar {
      position: relative; z-index: 80; display: flex; align-items: center; justify-content: space-between; gap: 10px;
      min-width: 0; height: calc(var(--topbar-row-height) + max(0px, calc(max(env(safe-area-inset-top), var(--dsh-safe-top)) - var(--topbar-safe-lift))));
      padding: max(0px, calc(max(env(safe-area-inset-top), var(--dsh-safe-top)) - var(--topbar-safe-lift))) 12px 0;
      border-bottom: 1px solid rgba(255,255,255,.10);
      background: rgba(18,22,33,.62); -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
      box-shadow: var(--glass-highlight), 0 6px 24px rgba(0,0,0,.28);
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    .title { min-width: 0; flex: 1 1 auto; display: flex; align-items: center; gap: 8px; overflow: visible; font-weight: 760; letter-spacing: -.02em; }
    .title-dot {
      flex: 0 0 auto; width: 9px; height: 9px; border-radius: 999px; background: var(--ok);
      box-shadow: 0 0 9px var(--ok), 0 0 18px rgba(142,240,183,.34); transition: background .3s, box-shadow .3s;
    }
    body.dot-blue .title-dot { background: var(--blue); box-shadow: 0 0 9px var(--blue), 0 0 18px rgba(94,180,255,.34); }
    body.dot-orange .title-dot { background: #ffb04d; box-shadow: 0 0 9px #ffb04d, 0 0 18px rgba(255,176,77,.34); }
    body.dot-flashing .title-dot { animation: dotFlash 1.1s ease-in-out infinite; }
    @keyframes dotFlash { 0%,100%{opacity:1} 50%{opacity:.35} }
    .thread-button {
      min-width: 0; flex: 1 1 auto; overflow: hidden; appearance: none; border: 0; padding: 6px 7px;
      border-radius: 12px; background: transparent; color: var(--text); font: inherit; display: flex; align-items: center; gap: 7px;
      cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none;
    }
    .thread-button:active { background: var(--panel); }
    .thread-name { max-width: min(56vw, 420px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 17px; font-weight: 760; }
    .thread-name::after { content: "\2304"; margin-left: 5px; color: var(--faint); font-size: 13px; }
    .top-actions {
      flex: 0 1 min(54vw, 340px); min-width: 0; display: flex; align-items: center; gap: 7px;
      overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch;
      scrollbar-width: none; touch-action: pan-x; -ms-overflow-style: none;
    }
    .top-actions::-webkit-scrollbar { display: none; }
    .top-actions > :first-child { margin-left: auto; }
    .chip {
      flex: 0 0 auto; height: var(--top-control-size); min-width: 40px; appearance: none;
      border: 1px solid rgba(255,255,255,.10); border-radius: 999px; background: rgba(255,255,255,.055);
      color: var(--muted); padding: 0 9px; font: inherit; font-size: 11.5px; font-weight: 760; line-height: 1;
      display: inline-grid; place-items: center; cursor: pointer; touch-action: manipulation; white-space: nowrap;
    }
    .chip:active { transform: scale(.95); }
    .chip .chip-label { max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip.icon-only { width: var(--top-control-size); min-width: var(--top-control-size); padding: 0; font-size: 15px; line-height: 1; }
    .chip.is-live { color: var(--ok); border-color: rgba(142,240,183,.28); background: rgba(142,240,183,.10); }
    .chip.is-model { color: #ffd28a; border-color: rgba(255,210,138,.26); background: rgba(255,210,138,.09); }
    .chip.is-route-local { color: var(--ok); border-color: rgba(142,240,183,.28); background: rgba(142,240,183,.10); }
    .chip.is-route-remote { color: var(--blue); border-color: rgba(94,180,255,.28); background: rgba(94,180,255,.10); }
    .chip:disabled { opacity: .5; cursor: wait; }
    .context-ring-wrap {
      flex: 0 0 auto; width: calc(var(--top-control-size) - 2px); height: calc(var(--top-control-size) - 2px);
      display: grid; place-items: center;
    }
    .context-ring {
      width: calc(var(--top-control-size) - 2px); height: calc(var(--top-control-size) - 2px); border-radius: 999px;
      border: 2px solid rgba(255,255,255,.14); position: relative;
    }
    .context-ring::after {
      content: ""; position: absolute; inset: 4px; border-radius: 999px; background: var(--ok);
      box-shadow: 0 0 8px var(--ok); transition: background .3s;
    }
    body.dot-blue .context-ring::after { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
    body.dot-orange .context-ring::after { background: #ffb04d; box-shadow: 0 0 8px #ffb04d; }
    .thread-menu-scrim {
      position: fixed; left: 0; right: 0; top: calc(max(0px, calc(max(env(safe-area-inset-top), var(--dsh-safe-top)) - var(--topbar-safe-lift))) + var(--topbar-row-height));
      bottom: 0; z-index: 19; background: rgba(0,0,0,.45); opacity: 0; visibility: hidden;
      transition: opacity .28s ease, visibility 0s .28s;
    }
    body:has(.thread-menu.is-open) .thread-menu-scrim { opacity: 1; visibility: visible; transition-delay: 0s; }
    .thread-menu {
      position: fixed; left: 12px; top: calc(max(0px, calc(max(env(safe-area-inset-top), var(--dsh-safe-top)) - var(--topbar-safe-lift))) + var(--topbar-row-height) + 8px);
      z-index: 20; width: min(520px, calc(100vw - 24px)); padding: 8px;
      border: 1px solid var(--glass-border); border-radius: 22px; background: rgba(26,30,42,.66);
      box-shadow: 0 18px 60px rgba(0,0,0,.5), var(--glass-highlight); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
      max-height: min(74vh, 640px);
      max-height: min(74svh, 640px); overflow: auto; scrollbar-width: none; -ms-overflow-style: none;
      opacity: 0; visibility: hidden; transform: translateY(-12px) scale(.98);
      transition: opacity .24s ease, transform .3s cubic-bezier(.22,.61,.36,1), visibility 0s .3s;
    }
    .thread-menu.is-open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
    .thread-menu::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .thread-section + .thread-section { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,.07); }
    .thread-section-label { padding: 4px 10px 6px; color: var(--faint); font-size: 11px; font-weight: 720; letter-spacing: .04em; }
    .thread-option {
      appearance: none; border: 0; width: 100%; font-family: inherit; border-radius: 12px; padding: 9px 10px;
      color: var(--text); background: transparent; text-align: left; display: grid; grid-template-columns: minmax(0,1fr) auto;
      align-items: center; gap: 10px; cursor: pointer; touch-action: manipulation;
    }
    .thread-option:hover, .thread-option:active { background: rgba(255,255,255,.055); }
    .thread-option[aria-current="true"] { background: rgba(255,255,255,.10); box-shadow: var(--glass-highlight); }
    .thread-option-title { min-width: 0; overflow: hidden; font-size: 13.5px; line-height: 1.35; display: flex; align-items: center; gap: 7px; }
    .thread-option-title .tname { display: block; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread-option-title .tmodel { flex: 0 0 auto; font-size: 10.5px; color: var(--faint); font-weight: 650; }
    .thread-option-state { flex: 0 0 auto; min-width: 30px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; }
    .thread-option-dot { width: 9px; height: 9px; border-radius: 999px; background: #5eb4ff; box-shadow: 0 0 10px rgba(94,180,255,.72); }
    .thread-option-dot.idle { background: var(--faint); box-shadow: none; }
    .thread-option-spinner {
      width: 14px; height: 14px; border-radius: 999px; border: 2px solid rgba(255,255,255,.22);
      border-top-color: rgba(244,244,245,.92); animation: threadSpin .85s linear infinite;
    }
    @keyframes threadSpin { to { transform: rotate(360deg); } }
    .thread-menu-btn {
      appearance: none; border: 0; width: 100%; font-family: inherit; display: grid; grid-template-columns: 20px minmax(0,1fr);
      align-items: center; gap: 10px; min-height: 42px; padding: 0 12px; border-radius: 13px;
      background: rgba(255,255,255,.045); color: var(--text); font-size: 14px; font-weight: 720; text-align: left;
      cursor: pointer; touch-action: manipulation; margin-top: 6px;
    }
    .thread-menu-btn:active { background: rgba(255,255,255,.09); }
    .thread-menu-btn .tmb-ico { display: grid; place-items: center; font-size: 15px; }
    .empty-thread-menu { padding: 18px 12px; color: var(--muted); font-size: 13px; }
    .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px 8px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
    .day-note { width: fit-content; margin: 0 auto 18px; color: var(--faint); font-size: 12px; }
    .message { display: flex; margin: 0 0 16px; }
    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }
    .bubble-wrap { max-width: min(760px, 86%); min-width: 0; }
    .message.assistant .bubble-wrap { width: 100%; max-width: none; }
    .message.user .bubble-wrap { max-width: min(720px, 82%); }
    .meta { margin: 0 0 5px; color: var(--faint); font-size: 11px; line-height: 1; display: flex; gap: 8px; align-items: center; }
    .message.user .meta { justify-content: flex-end; }
    .meta .mt { color: var(--muted); }
    .bubble { color: var(--text); font-size: 15px; line-height: 1.62; overflow-wrap: anywhere; }
    .message.user .bubble {
      padding: 11px 14px; border-radius: 19px; line-height: 1.48;
      background: linear-gradient(160deg, rgba(96,142,224,.52), rgba(66,104,196,.44));
      border: 1px solid rgba(151,188,255,.30);
      box-shadow: var(--glass-highlight), 0 8px 24px rgba(30,40,80,.35);
      -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    }
    .message.assistant .bubble { padding: 0; background: transparent; }
    .process-thinking { color: var(--text); font-size: 15px; line-height: 1.66; opacity: .78; }
    .think-block { border: 1px solid rgba(255,255,255,.09); border-radius: 12px; background: rgba(28,34,50,.55); overflow: hidden; }
    .think-block + .tools-block, .tools-block + .tools-block { margin-top: 6px; }
    .think-toggle, .tools-toggle { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: transparent; border: 0; color: var(--muted); font-size: 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .think-toggle .tw-arrow, .tools-toggle .tw-arrow { transition: transform .28s cubic-bezier(.22,.61,.36,1); font-size: 11px; }
    .think-toggle.closed .tw-arrow, .tools-toggle.closed .tw-arrow { transform: rotate(-90deg); }
    .think-body { max-height: 340px; overflow: auto; transition: max-height .32s cubic-bezier(.22,.61,.36,1); padding: 0 12px 9px; white-space: pre-wrap; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .think-body.closed { max-height: 0; overflow: hidden; padding: 0 12px; }
    .tools-block { margin-top: 6px; border: 1px solid rgba(255,255,255,.09); border-radius: 12px; background: rgba(28,34,50,.5); overflow: hidden; }
    .tools-toggle b.tw-n { color: var(--text); font-weight: 650; }
    .tools-body { display: flex; flex-direction: column; gap: 6px; max-height: 180px; overflow: auto; transition: max-height .32s cubic-bezier(.22,.61,.36,1); padding: 0 12px 9px; }
    .tools-body.closed { max-height: 0; overflow: hidden; padding: 0 12px; }
    .task-card { border: 1px solid rgba(255,255,255,.11); border-radius: 14px; background: rgba(30,36,54,.62); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); margin: 8px 0; overflow: hidden; animation: msgIn .3s ease both; }
    .task-head { display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font-size: 13px; font-weight: 600; color: var(--text); }
    .task-head .task-count { color: var(--muted); font-size: 12px; }
    .task-body { padding: 2px 14px 10px; max-height: 220px; overflow: auto; transition: max-height .32s cubic-bezier(.22,.61,.36,1); }
    .task-card.closed .task-body { max-height: 0; overflow: hidden; padding: 0 14px; }
    .task-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; padding: 6px 0; border-top: 1px dashed rgba(255,255,255,.07); }
    .task-row .tt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-row .ts { flex-shrink: 0; }
    .task-row .ts.run { color: #ffd166; }
    .task-row .ts.done { color: #7ee0a3; }
    .task-row .ts.err { color: #ff8095; }
    .process-tool-row { display: flex; flex-direction: row; gap: 6px; min-width: 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; touch-action: pan-x; }
    .process-tool-row::-webkit-scrollbar { display: none; }
    .process-tool {
      flex: 0 0 auto; max-width: 100%; padding: 5px 10px; border: 1px solid rgba(255,255,255,.10);
      border-radius: 999px; color: var(--faint); background: rgba(255,255,255,.06); font-size: 11.5px; line-height: 1.2;
      display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
    }
    .process-tool.ok { color: var(--ok); border-color: rgba(142,240,183,.22); background: rgba(142,240,183,.06); }
    .process-tool.err { color: #ff9a9a; border-color: rgba(255,154,154,.26); background: rgba(255,154,154,.07); }
    .process-tool .tg { flex: 0 0 auto; font-size: 12px; }
    .process-tool .tl { overflow: hidden; text-overflow: ellipsis; }
    .composer-shell {
      position: relative; z-index: 2; padding: 6px max(12px, calc((100vw - 860px) / 2)) var(--composer-bottom-pad);
      background: transparent; overscroll-behavior: contain; transform: translate3d(0, calc(-1 * var(--keyboard-shift)), 0);
      transition: transform .2s cubic-bezier(.22,.61,.36,1); will-change: transform;
    }
    body.keyboard-open { background: var(--bg); }
    .composer {
      position: relative; z-index: 2; display: grid; grid-template-columns: auto minmax(0,1fr) auto; align-items: end; gap: 5px;
      padding: 8px; border: 1px solid var(--glass-border); border-radius: 24px; background: rgba(28,33,46,.6);
      -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
      box-shadow: var(--glass-highlight), 0 10px 34px rgba(0,0,0,.35);
    }
    .icon-btn, .send-btn {
      flex: 0 0 auto; width: 38px; height: 38px; appearance: none; border: 0; border-radius: 999px;
      display: grid; place-items: center; cursor: pointer; touch-action: manipulation; padding: 0;
    }
    .icon-btn:active, .send-btn:active { transform: scale(.95); }
    .icon-btn { background: transparent; color: var(--faint); font-size: 21px; line-height: 1; }
    .send-btn { background: var(--accent); color: #111; font-size: 19px; font-weight: 900; }
    .send-btn:disabled { opacity: .45; cursor: wait; }
    .stop-square { width: 12px; height: 12px; border-radius: 3px; background: currentColor; display: block; }
    textarea {
      width: 100%; max-height: 130px; min-height: 36px; resize: none; border: 0; outline: 0; padding: 8px 4px;
      position: relative; top: -1px; color: var(--text); background: transparent;
      font: 500 16px / 1.4 ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      touch-action: auto; overscroll-behavior: contain; -webkit-user-select: text; user-select: text;
    }
    textarea::placeholder { color: var(--faint); }
    .markdown-body > *:first-child { margin-top: 0; }
    .markdown-body > *:last-child { margin-bottom: 0; }
    .markdown-body p { margin: 0 0 .45em; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin: .9em 0 .45em; line-height: 1.2; }
    .markdown-body h1 { font-size: 1.35em; } .markdown-body h2 { font-size: 1.18em; } .markdown-body h3 { font-size: 1.06em; }
    .markdown-body ul, .markdown-body ol { margin: .35em 0 .6em; padding-left: 1.35em; }
    .markdown-body li { margin: .12em 0; }
    .markdown-body blockquote { margin: .55em 0; padding-left: .9em; border-left: 3px solid #3f3f46; color: var(--muted); }
    .markdown-body pre { margin: .65em 0; padding: .75em .85em; border-radius: 12px; background: rgba(18,22,32,.6); border: 1px solid rgba(255,255,255,.08); overflow: auto; white-space: pre-wrap; }
    .markdown-body code { border-radius: 6px; padding: .08em .32em; background: rgba(24,28,40,.55); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
    .markdown-body pre code { padding: 0; background: transparent; }
    .markdown-body .table-scroll { width: 100%; margin: .65em 0; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; border: 1px solid rgba(63,70,96,.7); }
    .markdown-body table { width: 100%; min-width: 420px; border-collapse: collapse; background: rgba(24,30,46,.5); font-size: .94em; }
    .markdown-body th, .markdown-body td { padding: .48em .7em; border: 1px solid rgba(63,70,96,.7); vertical-align: top; text-align: left; }
    .markdown-body th { background: rgba(48,58,86,.72); color: var(--text); font-weight: 750; }
    .markdown-body tr:nth-child(even) td { background: rgba(48,58,86,.3); }
    .markdown-body a { color: #9ecbff; }
    @media (min-width: 900px) and (min-height: 650px) {
      :root { --ipad-thread-rail-width: clamp(300px, 27vw, 350px); --ipad-content-max: 1120px; }
      .app { grid-template-columns: var(--ipad-thread-rail-width) minmax(0,1fr); }
      .topbar { grid-column: 1 / -1; }
      .thread { padding-left: max(14px, calc((100vw - var(--ipad-thread-rail-width) - var(--ipad-content-max)) / 2)); padding-right: max(14px, calc((100vw - var(--ipad-thread-rail-width) - var(--ipad-content-max)) / 2)); }
      .composer-shell { padding-left: max(12px, calc((100vw - var(--ipad-thread-rail-width) - var(--ipad-content-max)) / 2)); padding-right: max(12px, calc((100vw - var(--ipad-thread-rail-width) - var(--ipad-content-max)) / 2)); }
      .thread-menu { left: var(--ipad-thread-rail-width); }
    }
    @media (max-width: 700px) {
      :root { --topbar-row-height: 44px; --topbar-safe-lift: 12px; --top-control-size: 24px; }
      .topbar { padding-left: 12px; padding-right: 12px; }
      .thread-name { font-size: 16px; max-width: 48vw; }
      .chip { min-width: 34px; padding-inline: 7px; font-size: 10.5px; }
      .chip .chip-label { max-width: 72px; }
    }
    /* ---- 自适应补齐（v1.3.x）---- */
    /* 中间档 700–900px：内容限宽居中，避免大屏留白不均衡 */
    @media (min-width: 700px) and (max-width: 900px) {
      .thread { padding-left: max(14px, calc((100vw - 720px) / 2)); padding-right: max(14px, calc((100vw - 720px) / 2)); }
      .composer-shell { padding-left: max(12px, calc((100vw - 720px) / 2)); padding-right: max(12px, calc((100vw - 720px) / 2)); }
    }
    /* 极窄屏 ≤360px：行高收紧，chip 收敛 */
    @media (max-width: 360px) {
      :root { --topbar-row-height: 40px; --topbar-safe-lift: 10px; --top-control-size: 22px; }
      .thread-name { font-size: 15px; }
      .chip { min-width: 30px; padding-inline: 6px; font-size: 10px; }
      .chip .chip-label { max-width: 56px; }
      .bubble { font-size: 14.5px; }
    }
    /* 横屏矮视口（浏览器直开兜底，APK 已锁 portrait）：内容居中限宽 + 紧凑顶栏 */
    @media (orientation: landscape) and (max-height: 500px) {
      :root { --topbar-row-height: 40px; --topbar-safe-lift: 10px; }
      .thread, .composer-shell { padding-left: max(12px, calc((100vw - 680px) / 2)); padding-right: max(12px, calc((100vw - 680px) / 2)); }
    }
    body.standalone .thread { padding-top: 14px; }
    /* ---- v1.2: 附件胶囊 / 模型菜单 / 余额 ---- */
    .attach-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 6px 6px; }
    .attach-chip {
      display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
      padding: 4px 8px 4px 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px;
      background: rgba(255,255,255,.075); color: var(--muted); font-size: 11.5px; line-height: 1.3;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
    }
    .attach-chip .ac-name { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .attach-chip .ac-size { color: var(--faint); flex: 0 0 auto; }
    .attach-chip.uploading { opacity: .7; }
    .attach-chip.ok { color: #c9f3dd; border-color: rgba(142,240,183,.24); background: rgba(142,240,183,.07); }
    .attach-chip.err { color: #ff9a9a; border-color: rgba(255,154,154,.3); background: rgba(255,154,154,.08); }
    .attach-chip .ac-x {
      appearance: none; border: 0; background: transparent; color: inherit; font-size: 13px; line-height: 1;
      padding: 2px 3px; cursor: pointer; border-radius: 999px;
    }
    .chip.is-balance { color: #8ef0b7; border-color: rgba(142,240,183,.28); background: rgba(142,240,183,.10); }
    .chip.is-balance.off { color: var(--faint); border-color: rgba(255,255,255,.10); background: rgba(255,255,255,.055); }
    .bubble .attach-note { margin-top: 8px; font-size: 11.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
    .bubble .attach-note span { padding: 2px 8px; border: 1px solid rgba(255,255,255,.10); border-radius: 999px; background: rgba(255,255,255,.05); }
    .model-menu {
      position: fixed; right: 12px; top: calc(max(0px, calc(max(env(safe-area-inset-top), var(--dsh-safe-top)) - var(--topbar-safe-lift))) + var(--topbar-row-height) + 8px);
      z-index: 30; width: min(440px, calc(100vw - 24px)); padding: 8px;
      border: 1px solid var(--glass-border); border-radius: 22px; background: rgba(26,30,42,.66);
      box-shadow: 0 18px 60px rgba(0,0,0,.5), var(--glass-highlight); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
      max-height: min(74vh, 640px);
      max-height: min(74svh, 640px); overflow: auto; scrollbar-width: none; -ms-overflow-style: none;
      opacity: 0; visibility: hidden; transform: translateY(-12px) scale(.98);
      transition: opacity .24s ease, transform .3s cubic-bezier(.22,.61,.36,1), visibility 0s .3s;
    }
    .model-menu.is-open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
    .model-menu::-webkit-scrollbar { width: 0; height: 0; display: none; }
    .model-row { appearance: none; border: 0; width: 100%; font-family: inherit; border-radius: 12px; padding: 9px 10px; color: var(--text); background: transparent; text-align: left; cursor: pointer; }
    .model-row:hover, .model-row:active { background: rgba(255,255,255,.055); }
    .model-row.sel { background: rgba(255,255,255,.10); box-shadow: var(--glass-highlight); }
    .model-row .mr-name { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
    .model-row .mr-desc { font-size: 11px; color: var(--faint); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .effort-row { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .effort-chip {
      appearance: none; border: 1px solid rgba(255,255,255,.10); border-radius: 999px; background: rgba(255,255,255,.05);
      color: var(--muted); font: inherit; font-size: 10.5px; font-weight: 700; padding: 2px 9px; cursor: pointer;
    }
    .effort-chip.sel { color: #ffd28a; border-color: rgba(255,210,138,.3); background: rgba(255,210,138,.1); }
    .model-scrim { position: fixed; inset: 0; z-index: 29; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .28s ease, visibility 0s .28s; }
    body:has(.model-menu.is-open) .model-scrim { opacity: 1; visibility: visible; transition-delay: 0s; }
    /* ---- 工作区选择器（新建会话，v1.3.x） ---- */
    .ws-scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); opacity: 0; visibility: hidden; transition: opacity .28s ease, visibility 0s .28s; }
    body:has(.ws-menu.is-open) .ws-scrim { opacity: 1; visibility: visible; transition-delay: 0s; }
    .ws-menu {
      position: fixed; left: 14px; right: 14px; bottom: calc(max(env(safe-area-inset-bottom), var(--dsh-safe-bottom, 0px)) + 14px);
      z-index: 41; border: 1px solid var(--glass-border); border-radius: 22px; background: rgba(26,30,42,.72);
      box-shadow: 0 18px 60px rgba(0,0,0,.5), var(--glass-highlight);
      backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
      max-height: min(62vh, 520px); max-height: min(62svh, 520px); overflow: hidden;
      display: flex; flex-direction: column;
      opacity: 0; visibility: hidden; transform: translateY(24px) scale(.98);
      transition: opacity .24s ease, transform .3s cubic-bezier(.22,.61,.36,1), visibility 0s .3s;
    }
    .ws-menu.is-open { opacity: 1; visibility: visible; transform: none; transition-delay: 0s; }
    .ws-head { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px 9px; font-size: 14px; font-weight: 650; color: var(--text); }
    .ws-close { appearance: none; border: 0; background: rgba(255,255,255,.07); color: var(--muted); width: 26px; height: 26px; border-radius: 999px; font-size: 13px; line-height: 1; cursor: pointer; }
    .ws-body { overflow: auto; padding: 2px 8px 8px; scrollbar-width: none; }
    .ws-row { display: flex; flex-direction: column; gap: 3px; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 4px; border: 1px solid rgba(255,255,255,.08); border-radius: 14px; background: rgba(255,255,255,.045); color: var(--text); cursor: pointer; }
    .ws-row:active { transform: scale(.985); }
    .ws-row .wr-label { font-size: 13.5px; font-weight: 600; }
    .ws-row .wr-path { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .ws-foot { padding: 8px 16px 12px; font-size: 11px; color: var(--faint); border-top: 1px solid rgba(255,255,255,.06); }
    .scan-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    /* ---- 流畅动画 ---- */
    @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes pillIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
    @keyframes breathe { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .message.msg-in { animation: msgIn .32s cubic-bezier(.22,.61,.36,1) both; }
    .process-tool { animation: pillIn .24s ease both; }
    .attach-chip { animation: pillIn .24s ease both; }
    .composer, .thread-menu-btn, .chip, .icon-btn, .send-btn { transition: transform .18s ease, opacity .18s ease; }
    .composer:active, .thread-menu-btn:active, .send-btn:active { transform: scale(.98); }
    .day-note { transition: color .3s ease; }
    .title-dot { animation: breathe 2.4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="title">
        <span class="title-dot" id="title-dot"></span>
        <button class="thread-button" id="thread-button" type="button"><span class="thread-name" id="thread-name">选择线程</span></button>
      </div>
      <div class="top-actions">
        <div class="context-ring-wrap" id="status-ring" role="status" aria-label="连接状态" title="连接状态"><div class="context-ring"></div></div>
        <button class="chip icon-only" id="new-thread" type="button" title="新建线程" aria-label="新建线程">＋</button>
        <button class="chip icon-only" id="keep-awake" type="button" title="保持亮屏" aria-label="保持亮屏">☾</button>
        <button class="chip is-model" id="model-badge" type="button" title="切换模型" aria-label="切换模型" disabled><span class="chip-label" id="model-text">--</span></button>
        <button class="chip is-balance off" id="balance-chip" type="button" title="余额（桌面端同步）" aria-label="余额" hidden><span class="chip-label" id="balance-text">--</span></button>
        <button class="chip" id="route-badge" type="button" title="当前线路" aria-label="当前线路"><span id="route-text">本地</span></button>
        <button class="chip icon-only" id="settings-btn" type="button" title="设置" aria-label="设置">⚙</button>
      </div>
    </header>
    <div class="thread-menu-scrim" id="thread-menu-scrim" aria-hidden="true"></div>
    <div class="thread-menu" id="thread-menu" aria-label="选择会话"></div>
    <div class="model-scrim" id="model-scrim" aria-hidden="true"></div>
    <div class="model-menu" id="model-menu" aria-label="切换模型"></div>
    <div class="ws-scrim" id="ws-scrim" aria-hidden="true"></div>
    <div class="ws-menu" id="ws-menu" aria-label="选择工作区">
      <div class="ws-head"><span>选择工作区</span><button class="ws-close" id="ws-close" type="button" aria-label="关闭">✕</button></div>
      <div class="ws-body" id="ws-body"></div>
      <div class="ws-foot">新会话将放入所选工作区，桌面侧栏可见</div>
    </div>
    <main class="thread" id="thread" aria-label="聊天记录">
      <div class="day-note" id="day-note">选择或新建一个 DSH 会话</div>
    </main>
    <footer class="composer-shell">
      <div class="attach-chips" id="attach-chips" hidden></div>
      <form class="composer" id="composer">
        <button class="icon-btn" id="attach" type="button" title="附件" aria-label="附件">📎</button>
        <input class="file-input" id="file-input" type="file" multiple style="display:none" />
        <textarea id="text" rows="1" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="发消息给 DSH…"></textarea>
        <button class="send-btn" id="send" type="submit" title="发送" aria-label="发送">↑</button>
      </form>
    </footer>
    <input class="file-input" id="scan-input" type="file" accept="image/*" capture="environment" style="display:none" />
  </div>
  <script src="jsQR.min.js"></script>
  <script>
  "use strict";
  const LS_URL = "dshmini_url", LS_TOKEN = "dshmini_token";
  const thread = document.getElementById("thread");
  const threadName = document.getElementById("thread-name");
  const threadMenu = document.getElementById("thread-menu");
  const threadButton = document.getElementById("thread-button");
  const textareaEl = document.getElementById("text");
  const sendBtn = document.getElementById("send");
  const modelBadge = document.getElementById("model-badge");
  const modelText = document.getElementById("model-text");
  const modelMenu = document.getElementById("model-menu");
  const modelScrim = document.getElementById("model-scrim");
  const balanceChip = document.getElementById("balance-chip");
  const balanceText = document.getElementById("balance-text");
  const routeText = document.getElementById("route-text");
  const routeBadge = document.getElementById("route-badge");
  const newThreadBtn = document.getElementById("new-thread");
  const dayNote = document.getElementById("day-note");
  const statusRing = document.getElementById("status-ring");
  const keepAwakeBtn = document.getElementById("keep-awake");
  const settingsBtn = document.getElementById("settings-btn");
  const attachBtn = document.getElementById("attach");
  const fileInput = document.getElementById("file-input");
  const scanInput = document.getElementById("scan-input");
  const attachChips = document.getElementById("attach-chips");

  // 沉浸式安全区：APK WebView 桥读状态栏/导航栏高度（Android env() 不可靠恒 0）
  (function initSafeAreas() {
    try {
      var b = window.DshMiniBridge;
      if (b && b.getSafeTop) {
        var t = Number(b.getSafeTop()) || 0;
        if (t > 0) document.documentElement.style.setProperty("--dsh-safe-top", t + "px");
      }
      if (b && b.getSafeBottom) {
        var bt = Number(b.getSafeBottom()) || 0;
        if (bt > 0) document.documentElement.style.setProperty("--dsh-safe-bottom", bt + "px");
      }
    } catch (e) { /* 浏览器直开无桥，忽略 */ }
  })();

  // 扫码进入：URL 里的 ?token= 自动保存（GPT Mini 同款）
  (function initQueryToken() {
    const qt = new URLSearchParams(location.search).get("token");
    if (qt) localStorage.setItem(LS_TOKEN, qt.trim());
  })();

  function apiBase() {
    const v = localStorage.getItem(LS_URL);
    return (v && v.trim()) ? v.trim().replace(/\/+$/, "") : location.origin + "/dsh-mini/api";
  }
  function token() { return (localStorage.getItem(LS_TOKEN) || "").trim(); }
  function authHeader() { const t = token(); return t ? { "Authorization": "Bearer " + t } : {}; }
  function qs() { const t = token(); return t ? ("?token=" + encodeURIComponent(t)) : ""; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  async function apiGet(path) {
    const r = await fetch(apiBase() + path, { headers: authHeader() });
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }

  // ---------- 路由徽章 ----------
  (function initRoute() {
    const h = location.hostname;
    const local = h === "localhost" || h === "127.0.0.1" || h === "::1" || h === "";
    routeText.textContent = local ? "本地" : "远程";
    routeBadge.classList.toggle("is-route-local", local);
    routeBadge.classList.toggle("is-route-remote", !local);
  })();

  // ---------- 保持亮屏 ----------
  let wakeLock = null, napping = false;
  async function keepAwake(on) {
    keepAwakeBtn.textContent = on ? "☀" : "☾";
    keepAwakeBtn.classList.toggle("is-live", on);
    if (!on) { try { if (wakeLock) wakeLock.release(); } catch {} napping = false; return; }
    napping = true;
    try { if ("wakeLock" in navigator) { wakeLock = await navigator.wakeLock.request("screen"); } } catch {}
  }
  keepAwakeBtn.onclick = () => keepAwake(!napping);
  document.addEventListener("visibilitychange", () => { if (napping && document.visibilityState === "visible") keepAwake(true); });

  // ---------- 状态 ----------
  let threads = [], currentId = null, es = null, seenSeqs = new Set();
  let curMsg = null, curThinking = null;
  let busy = false;
  let renderBatch = false;   // 历史批量渲染期间挂起 scrollDown（避免逐段强制布局）
  let lastSeqMax = 0;        // 已渲染历史的最大 seq（增量同步基准）
  let thinkUserCollapsed = null; // null=未手动操作（turn-end 自动折叠）| true/false=用户选择
  let taskCardEl = null, taskCount = 0, taskDone = 0; // 任务表（live turn 聚合）
  let attachments = [];   // {name, size, mime, path, isImage, status}
  let modelCatalog = null; // {models, default}
  let currentModel = null; // {provider, model, reasoningEffort}

  function setBusy(on) {
    busy = on;
    sendBtn.innerHTML = on ? '<span class="stop-square"></span>' : "↑";
    sendBtn.title = on ? "停止生成" : "发送";
    document.body.classList.toggle("dot-orange", on);
  }
  setBusy(false);

  // ---------- 轻量 markdown ----------
  function mdInline(s) {
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>")
      .replace(/\`([^\`]+)\`/g, "<code>$1</code>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
  }
  function mdRender(el, text) {
    const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
    const out = [];
    let inCode = false, codeBuf = [];
    for (const line of lines) {
      const fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        if (!inCode) { inCode = true; codeBuf = []; }
        else { inCode = false; out.push("<pre><code>" + esc(codeBuf.join("\n")) + "</code></pre>"); }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      const t = line.trim();
      if (!t) continue;
      if (/^#{1,3}\s/.test(t)) {
        const lvl = t.match(/^(#{1,3})\s/)[1].length;
        out.push("<h" + lvl + ">" + mdInline(t.replace(/^#{1,3}\s/, "")) + "</h" + lvl + ">");
      } else if (/^[-*]\s/.test(t)) {
        out.push("<li>" + mdInline(t.replace(/^[-*]\s/, "")) + "</li>");
      } else if (/^\d+\.\s/.test(t)) {
        out.push("<li>" + mdInline(t.replace(/^\d+\.\s/, "")) + "</li>");
      } else if (/^>\s?/.test(t)) {
        out.push("<blockquote>" + mdInline(t.replace(/^>\s?/, "")) + "</blockquote>");
      } else {
        out.push("<p>" + mdInline(t) + "</p>");
      }
    }
    if (inCode) out.push("<pre><code>" + esc(codeBuf.join("\n")) + "</code></pre>");
    el.innerHTML = out.join("");
  }

  // ---------- 模型徽章 / 菜单 ----------
  function modelLabel(m) {
    if (!m || !m.model) return "--";
    const short = String(m.model).split("/").pop();
    return m.reasoningEffort ? short + "·" + m.reasoningEffort : short;
  }
  function setModelBadge(m) {
    currentModel = m || null;
    modelText.textContent = modelLabel(currentModel);
  }
  async function refreshModel() {
    if (!currentId) return;
    try {
      const d = await apiGet("/threads/" + encodeURIComponent(currentId) + "/model");
      setModelBadge(d);
    } catch {}
  }
  function toggleModelMenu(open) {
    const want = open == null ? !modelMenu.classList.contains("is-open") : open;
    modelMenu.classList.toggle("is-open", want);
    if (!want) return;
    toggleMenu(false);
    renderModelMenu();
    if (!modelCatalog) {
      modelMenu.innerHTML = '<div class="empty-thread-menu">加载模型列表…</div>';
      apiGet("/models").then(d => { modelCatalog = d; renderModelMenu(); })
        .catch(e => { modelMenu.innerHTML = '<div class="empty-thread-menu">模型列表加载失败：' + esc(e.message) + "</div>"; });
    }
  }
  function renderModelMenu() {
    modelMenu.innerHTML = "";
    if (!modelCatalog || !Array.isArray(modelCatalog.models) || !modelCatalog.models.length) {
      const empty = document.createElement("div");
      empty.className = "empty-thread-menu";
      empty.textContent = "没有可用模型";
      modelMenu.appendChild(empty);
      return;
    }
    const byProvider = new Map();
    for (const m of modelCatalog.models) {
      if (!byProvider.has(m.provider)) byProvider.set(m.provider, []);
      byProvider.get(m.provider).push(m);
    }
    for (const [provider, list] of byProvider) {
      const section = document.createElement("section");
      section.className = "thread-section";
      const label = document.createElement("div");
      label.className = "thread-section-label";
      label.textContent = provider;
      section.appendChild(label);
      for (const m of list) {
        const row = document.createElement("button");
        row.type = "button";
        row.className = "model-row";
        const sel = currentModel && currentModel.provider === m.provider && currentModel.model === m.model;
        if (sel) row.classList.add("sel");
        row.innerHTML = '<div class="mr-name"><span>' + esc(m.name) +
          (sel ? " ✓" : "") + "</span></div>" +
          (m.description ? '<div class="mr-desc">' + esc(m.description) + "</div>" : "");
        row.onclick = () => selectModel(m.provider, m.model, m.defaultReasoningEffort || undefined);
        if (Array.isArray(m.reasoningEfforts) && m.reasoningEfforts.length > 1) {
          const er = document.createElement("div");
          er.className = "effort-row";
          for (const e of m.reasoningEfforts) {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "effort-chip" + (sel && currentModel.reasoningEffort === e.id ? " sel" : "");
            chip.textContent = e.name;
            chip.onclick = (ev) => { ev.stopPropagation(); selectModel(m.provider, m.model, e.id); };
            er.appendChild(chip);
          }
          row.appendChild(er);
        }
        section.appendChild(row);
      }
      modelMenu.appendChild(section);
    }
  }
  async function selectModel(provider, model, effort) {
    try {
      const r = await fetch(apiBase() + "/threads/" + encodeURIComponent(currentId) + "/model", {
        method: "POST", headers: Object.assign({}, authHeader(), { "Content-Type": "application/json" }),
        body: JSON.stringify({ provider, model, reasoningEffort: effort || undefined }),
      });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      setModelBadge({ provider: d.provider, model: d.model, reasoningEffort: d.reasoningEffort });
      toggleModelMenu(false);
      showNotice("模型已切换：" + modelLabel(currentModel), false);
    } catch (e) {
      showNotice("切换失败：" + e.message, true);
    }
  }
  modelBadge.onclick = () => toggleModelMenu();
  modelScrim.onclick = () => toggleModelMenu(false);

  // ---------- 余额（桌面端同步 → host 缓存 → 手机） ----------
  function renderBalance(d) {
    balanceChip.hidden = false;

  // ---------- 附件 ----------
  function renderAttachmentChips() {
    attachChips.innerHTML = "";
    attachChips.hidden = attachments.length === 0;
    attachments.forEach((a, i) => {
      const chip = document.createElement("span");

      chip.innerHTML = '<span class="ac-ico">' + (a.isImage ? "🖼" : "📄") + "</span>" +

  async function uploadAttachment(f) {
    const chip = { name: f.name, size: f.size, mime: f.type || "", path: null, isImage: (f.type || "").startsWith("image/"), status: "uploading" };
    attachments.push(chip);
    renderAttachmentChips();
    try {
      const up = apiBase() + "/upload?session=" + encodeURIComponent(currentId) + "&name=" + encodeURIComponent(f.name);
      const r = await fetch(up, { method: "POST", headers: authHeader(), body: f });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      chip.path = d.path; chip.name = d.name || chip.name; chip.size = d.size; chip.mime = d.mime; chip.isImage = d.isImage; chip.status = "ok";

  // ---------- 步骤渲染 ----------
  function applyStep(s, fromHistory) {
    if (s.seq != null) {
      if (seenSeqs.has(s.seq)) return;
      seenSeqs.add(s.seq);
      lastSeqMax = Math.max(lastSeqMax, s.seq);
    }
    switch (s.type) {
      case "thinking": {
        if (!curThinking) newThinkingBlock(true);
        curThinking._thinkBody.textContent += s.text;
        scrollDown();
        break;
      }
      case "assistant": {
        if (!curMsg) {
          curMsg = document.createElement("div");
          curMsg.className = "message assistant";
          const wrap = document.createElement("div");
          wrap.className = "bubble-wrap";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = '<span class="mt">DSH</span>';
          const bubble = document.createElement("div");
          bubble.className = "bubble markdown-body";
          wrap.append(meta, bubble);
          curMsg._bubble = bubble;
          curMsg.appendChild(wrap);
          curMsg.classList.add("msg-in");
          thread.appendChild(curMsg);
          if (curThinking) { curThinking.remove(); curThinking = null; }
        }
        if (curMsg._bubble) curMsg._bubble.textContent += s.text;
        scrollDown();
        break;
      }
      case "user": {
        const um = document.createElement("div");
        um.className = "message user";
        const wrap = document.createElement("div");
        wrap.className = "bubble-wrap";
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = '<span class="mt">桌面端</span>';
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = s.text || "";
        wrap.append(meta, bubble);
        um.appendChild(wrap);
        um.classList.add("msg-in");
        thread.appendChild(um);
        curMsg = null; curThinking = null;
        scrollDown();
        break;
      }
      case "tool": {
        renderToolPill(s);
        if (s.status === "call" || s.status === "result") taskCardAdd(s);
        scrollDown();
        break;
      }
      case "status": {
        if (s.status === "turn-start") { setBusy(true); taskCardReset(); }
        if (s.status === "turn-end") { setBusy(false); taskCardFinish(s.reason); closeThinkBlocks(); showNotice(s.reason === "completed" ? "本轮完成" : s.reason === "error" ? "本轮出错" : "已停止", s.reason === "error"); }
        break;
      }
      case "model": {
        setModelBadge({ provider: s.provider, model: s.model, reasoningEffort: s.reasoningEffort });
        break;
      }
      case "title": {
        if (s.title) {
          threadName.textContent = s.title;
          const t = threads.find(x => x.id === currentId);
          if (t) t.title = s.title;
        }
        break;
      }
    }
  }

  function scrollDown() { if (!renderBatch) thread.scrollTop = thread.scrollHeight; }

  // ---------- 分片批量渲染（历史提速） ----------
  // host 端 getHistory 已把相邻 thinking/assistant/tool step 合并为 segments（4597→数百），
  // 前端 rAF 每帧 ≤100 段渲染 + 渲染期挂起 scrollDown（原逐 step scrollTop=scrollHeight 强制布局 ×4597 是卡顿根因）。
  function newAssistantBlock() {
    curMsg = document.createElement("div");
    curMsg.className = "message assistant";
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = '<span class="mt">DSH</span>';
    const bubble = document.createElement("div");
    bubble.className = "bubble markdown-body";
    wrap.append(meta, bubble);
    curMsg._bubble = bubble;
    curMsg.appendChild(wrap);
    curMsg.classList.add("msg-in");
    thread.appendChild(curMsg);
    // 思考块不删除，收成折叠态保留在消息流上方（v1.3.x 折叠语义）；
    // 后续 thinking 段则新建独立块。
    if (curThinking) {
      curThinking._thinkBody.classList.add("closed");
      curThinking._thinkToggle.classList.add("closed");
      curThinking = null;
    }
  }
  function renderToolPill(s) {
    if (!curMsg) newAssistantBlock();
    if (!curMsg._toolsBlock || !curMsg._toolsBlock.isConnected) {
      const block = document.createElement("div");
      block.className = "tools-block";
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = "tools-toggle";
      toggle.innerHTML = '<span>🛠 工具调用 <b class="tw-n">0</b></span><span class="tw-arrow">▾</span>';
      const body = document.createElement("div");
      body.className = "tools-body closed";
      block.append(toggle, body);
      toggle.addEventListener("click", () => {
        const cl = body.classList.toggle("closed");
        toggle.classList.toggle("closed", cl);
      });
      curMsg._toolsBlock = block;
      curMsg._bubble.appendChild(block);
    }
    const body = curMsg._toolsBlock.querySelector(".tools-body");
    const nEl = curMsg._toolsBlock.querySelector(".tw-n");
    nEl.textContent = (parseInt(nEl.textContent, 10) || 0) + 1;
    const pill = document.createElement("span");
    const icon = s.status === "call" ? "⚙" : (s.isError ? "✕" : "✓");
    pill.className = "process-tool" + (s.status === "call" ? "" : (s.isError ? " err" : " ok"));
    pill.innerHTML = '<span class="tg">' + icon + '</span><span class="tl">' + esc(s.tool || "") + (s.status === "call" ? " …" : "") + "</span>";
    body.appendChild(pill);
  }

  // 思考折叠块：流式期间（live）默认展开，turn-end 后按用户最后选择状态折叠
  function newThinkingBlock(expand) {
    curThinking = document.createElement("div");
    curThinking.className = "message assistant";
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";
    const block = document.createElement("div");
    block.className = "think-block";
    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.className = "think-toggle" + (expand ? "" : " closed");
    toggle.innerHTML = '<span>💭 思考过程</span><span class="tw-arrow">▾</span>';
    const body = document.createElement("div");
    body.className = "think-body" + (expand ? "" : " closed");
    block.append(toggle, body);
    toggle.addEventListener("click", () => {
      const cl = body.classList.toggle("closed");
      toggle.classList.toggle("closed", cl);
      thinkUserCollapsed = cl;
    });
    wrap.appendChild(block);
    curThinking.appendChild(wrap);
    curThinking._thinkBody = body;
    curThinking._thinkToggle = toggle;
    curThinking.classList.add("msg-in");
    thread.appendChild(curThinking);
  }
  // turn-end 时收束：用户从未手动切换 → 折叠思考块（默认）；动过 → 尊重其选择
  function closeThinkBlocks() {
    if (thinkUserCollapsed !== null) return;
    if (curThinking && curThinking._thinkBody) {
      curThinking._thinkBody.classList.add("closed");
      curThinking._thinkToggle.classList.add("closed");
    }
  }

  // ---------- 任务表（live turn 聚合：turn-start 建卡，tool 逐条填充，turn-end 收束） ----------
  function taskCardReset() {
    if (!taskCardEl || !taskCardEl.isConnected) {
      taskCardEl = document.createElement("div");
      taskCardEl.className = "task-card";
      thread.appendChild(taskCardEl);
    } else {
      taskCardEl.classList.remove("closed");
    }
    taskCardEl.innerHTML = '<div class="task-head"><span>📋 任务</span><span class="task-count"></span></div><div class="task-body"></div>';
    taskCount = 0; taskDone = 0;
  }
  function taskCardAdd(s) {
    if (!taskCardEl || !taskCardEl.isConnected) taskCardReset();
    const body = taskCardEl.querySelector(".task-body");
    const icon = s.status === "call" ? "⚙" : (s.isError ? "✕" : "✓");
    if (s.status === "call") {
      const row = document.createElement("div");
      row.className = "task-row run";
      row.dataset.callId = s.callId || "";
      row.innerHTML = '<span class="tt">' + icon + " " + esc(s.tool || "…") + '</span><span class="ts run">进行中</span>';
      body.appendChild(row);
      taskCount++;
    } else {
      // result：按 callId 匹配进行中的行（无 callId 按顺序取第一个 .run）
      let row = null;
      if (s.callId) {
        for (const r of body.querySelectorAll(".task-row.run")) {
          if (r.dataset.callId === s.callId) { row = r; break; }
        }
      }
      if (!row) row = body.querySelector(".task-row.run");
      if (row) {
        row.classList.remove("run");
        row.classList.add("done");
        row.querySelector(".ts").textContent = s.isError ? "失败" : "完成";
        row.querySelector(".ts").className = "ts " + (s.isError ? "err" : "done");
        taskDone++;
      }
    }
    const h = taskCardEl.querySelector(".task-count");
    if (h) h.textContent = taskCount + (taskDone ? " · 完成 " + taskDone : "");
  }
  function taskCardFinish(reason) {
    if (!taskCardEl || !taskCardEl.isConnected) return;
    const h = taskCardEl.querySelector(".task-count");
    if (h) h.textContent = "×" + taskCount + " · 完成 " + taskDone + (reason === "error" ? " · 出错" : "");
    taskCardEl.classList.add("closed");
  }
  function renderSegment(seg, batched) {
    if (!seg) return;
    switch (seg.type) {
      case "thinking": {
        if (!curThinking) newThinkingBlock(!batched);
        curThinking._thinkBody.textContent += seg.text || "";
        scrollDown();
        break;
      }
      case "assistant": {
        if (!curMsg || batched) newAssistantBlock();
        if (curMsg._bubble) curMsg._bubble.textContent += seg.text || "";
        scrollDown();
        break;
      }
      case "tools": {
        if (!curMsg || batched) newAssistantBlock();
        for (const it of seg.items || []) renderToolPill(it);
        scrollDown();
        break;
      }
      case "user": {
        const um = document.createElement("div");
        um.className = "message user";
        const wrap = document.createElement("div");
        wrap.className = "bubble-wrap";
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = '<span class="mt">桌面端</span>';
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = seg.text || "";
        wrap.append(meta, bubble);
        um.appendChild(wrap);
        um.classList.add("msg-in");
        thread.appendChild(um);
        curMsg = null; curThinking = null;
        scrollDown();
        break;
      }
      case "status": {
        if (seg.status === "turn-start") setBusy(true);
        if (seg.status === "turn-end") { setBusy(false); showNotice(seg.reason === "completed" ? "本轮完成" : seg.reason === "error" ? "本轮出错" : "已停止", seg.reason === "error"); }
        break;
      }
      case "model": {
        setModelBadge({ provider: seg.provider, model: seg.model, reasoningEffort: seg.reasoningEffort });
        break;
      }
      case "title": {
        if (seg.title) {
          threadName.textContent = seg.title;
          const t = threads.find(x => x.id === currentId);
          if (t) t.title = seg.title;
        }
        break;
      }
    }
  }
  function renderSegments(segs, batched) {
    if (!segs || !segs.length) return;
    let idx = 0;
    if (!batched) {
      for (; idx < segs.length; idx++) renderSegment(segs[idx], false);
      return;
    }
    renderBatch = true;
    const CHUNK = 100;
    (function next() {
      if (idx >= segs.length) {
        renderBatch = false;
        scrollDown();
        return;
      }
      const end = Math.min(idx + CHUNK, segs.length);
      for (; idx < end; idx++) renderSegment(segs[idx], true);
      requestAnimationFrame(next);
    })();
  }

  // ---------- 历史 ----------
  async function loadHistory(id, merge) {
    const key = "dshhist:" + id;
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem(key) || "null"); } catch {}
    const cacheHit = !merge && cached && Array.isArray(cached.segments) && cached.segments.length > 0;
    if (cacheHit) {
      // 缓存立即（秒开）渲染，后台 fetch 只核对 revision 是否新增
      lastSeqMax = cached.rev || 0;
      curMsg = null; curThinking = null;
      thread.innerHTML = '<div class="day-note">' + esc(cached.title || id) + "</div>";
      renderSegments(cached.segments, true);
      if (cached.model) setModelBadge(cached.model);
      else refreshModel();
    }
    try {
      const r = await fetch(apiBase() + "/threads/" + encodeURIComponent(id) + "/history", { headers: authHeader() });
      if (!r.ok) return;
      const hist = await r.json();
      if (!merge) {
        if (cacheHit && (hist.revision || 0) === (cached.rev || 0)) {
          // 无新增内容：缓存已渲染，只同步标题
          if (hist.title && threadName.textContent !== hist.title) threadName.textContent = hist.title;
        } else {
          thread.innerHTML = '<div class="day-note">' + esc(hist.title || id) + "</div>";
          curMsg = null; curThinking = null; lastSeqMax = 0;
          if (hist.segments && hist.segments.length) renderSegments(hist.segments, true);
          else for (const s of hist.steps || []) applyStep(s, true);
        }
      } else {
        // merge 模式：只补 seqMax 大于已渲染基准的新段（SSE 断连兜底，避免全量重绘闪烁）
        const fresh = (hist.segments || []).filter(sg => sg.seqMax > lastSeqMax);
        if (fresh.length) {
          renderBatch = true;
          for (const sg of fresh) renderSegment(sg, false);
          renderBatch = false;
        }
      }
      lastSeqMax = Math.max(lastSeqMax, hist.revision || 0);
      if (hist.model) setModelBadge(hist.model);
      else refreshModel();
      scrollDown();
      try {
        localStorage.setItem(key, JSON.stringify({ rev: hist.revision || 0, segments: hist.segments || [], title: hist.title || "", model: hist.model || null, at: Date.now() }));
      } catch {}
    } catch {}
  }

  // ---------- 线程菜单（按工作区 cwd 分组） ----------
  function renderThreadMenu() {
    threadMenu.innerHTML = "";
    if (!threads.length) {
      const empty = document.createElement("div");
      empty.className = "empty-thread-menu";
      empty.textContent = "还没有会话。点「＋」新建一个。";
      threadMenu.appendChild(empty);
    } else {
      // 工作区分组：cwd 取最后一段作标题，同名才回退完整路径；纯 hash 型 cwd 归并到「其他工作区」
      const groups = new Map();
      for (const t of threads) {
        let key = (t.cwd || t.workspace || "").trim();
        const base = String(key).split(/[\\/]/).filter(Boolean).pop() || "";
        if (!key || /^[0-9a-f]{8,}$/i.test(base)) key = "(其他工作区)";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(t);
      }
      const nameCount = new Map();
      for (const k of groups.keys()) {
        const base = String(k).split(/[\\/]/).filter(Boolean).pop() || k;
        nameCount.set(base, (nameCount.get(base) || 0) + 1);
      }
      const keys = [...groups.keys()].sort((a, b) => a.localeCompare(b));
      for (const key of keys) {
        const list = groups.get(key);
        const base = String(key).split(/[\\/]/).filter(Boolean).pop() || key;
        const labelText = (nameCount.get(base) > 1 ? key : base) + "（" + list.length + "）";
        const section = document.createElement("section");
        section.className = "thread-section";
        const label = document.createElement("div");
        label.className = "thread-section-label";
        label.textContent = labelText;
        label.title = key;
        section.appendChild(label);
        const listDiv = document.createElement("div");
        for (const t of list) {
          const opt = document.createElement("button");
          opt.type = "button";
          opt.className = "thread-option";
          if (t.id === currentId) opt.setAttribute("aria-current", "true");
          const st = t.live
            ? '<span class="thread-option-spinner" title="运行中"></span>'
            : '<span class="thread-option-dot idle" title="空闲"></span>';
          const tmodel = t.model ? (String(t.model.model).split("/").pop() + (t.model.reasoningEffort ? "·" + t.model.reasoningEffort : "")) : "";
          opt.innerHTML = '<span class="thread-option-title"><span class="tname">' + esc(t.title || t.id) + "</span>" +
            (tmodel ? '<span class="tmodel">' + esc(tmodel) + "</span>" : "") + "</span>" +
            '<span class="thread-option-state">' + st + "</span>";
          opt.onclick = () => { toggleMenu(false); openChat(t.id, t.title || t.id); };
          listDiv.appendChild(opt);
        }
        section.appendChild(listDiv);
        threadMenu.appendChild(section);
      }
    }
    const setBtn = document.createElement("button");
    setBtn.type = "button";
    setBtn.className = "thread-menu-btn";
    setBtn.innerHTML = '<span class="tmb-ico">⚙</span><span>连接设置</span>';
    setBtn.onclick = () => { toggleMenu(false); openSettings(); };
    threadMenu.appendChild(setBtn);
  }

  function toggleMenu(open) {
    const want = open == null ? !threadMenu.classList.contains("is-open") : open;
    threadMenu.classList.toggle("is-open", want);
  }
  threadButton.onclick = () => { loadThreads(); toggleMenu(); };
  document.getElementById("thread-menu-scrim").onclick = () => toggleMenu(false);

  // ---------- 新建 ----------
  // v1.3.x：先选工作区再建会话——新会话 cwd 落在所选工作区，桌面侧栏即可见（桌面按工作区组织列表）。
  const wsMenu = document.getElementById("ws-menu");
  const wsBody = document.getElementById("ws-body");
  const wsScrim = document.getElementById("ws-scrim");
  const wsClose = document.getElementById("ws-close");
  function showWs(open) {
    wsMenu.classList.toggle("is-open", open);
    wsScrim.classList.toggle("is-open", open);
  }
  function openWsPicker() {
    wsBody.innerHTML = '<div class="empty-thread-menu">加载工作区…</div>';
    showWs(true);
    fetch(apiBase() + "/workspaces", { headers: authHeader() })
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(d => {
        const list = (d.workspaces || []).filter(w => w && w.cwd);
        if (!list.length) throw new Error("暂无工作区");
        wsBody.innerHTML = "";
        const map = new Map();
        for (const w of list) {
          if (map.has(w.cwd)) continue;
          map.set(w.cwd, w);
          const row = document.createElement("button");
          row.type = "button";
          row.className = "ws-row";
          row.innerHTML = '<span class="wr-label">' + esc(w.label || "") + '</span><span class="wr-path">' + esc(w.cwd) + "</span>";
          row.onclick = () => { showWs(false); newThreadWithCwd(w.cwd); };
          wsBody.appendChild(row);
        }
      })
      .catch(e => { wsBody.innerHTML = '<div class="empty-thread-menu">工作区加载失败：' + esc(e.message) + "</div>"; });
  }
  wsScrim.onclick = () => showWs(false);
  wsClose.onclick = () => showWs(false);
  newThreadBtn.onclick = () => { openWsPicker(); };
  async function newThreadWithCwd(cwd) {
    newThreadBtn.disabled = true;
    try {
      const r = await fetch(apiBase() + "/threads/new", { method: "POST", headers: authHeader(), body: JSON.stringify({ cwd: cwd || "" }) });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const { id } = await r.json();
      if (!id) throw new Error("响应缺少会话 id");
      await loadThreads();
      await openChat(id, "新会话");
      showNotice("已创建新会话");
    } catch (e) { showNotice("新建失败：" + e.message, true); }
    finally { newThreadBtn.disabled = false; }
  }

  // ---------- 聊天 ----------
  let ssFail = 0, syncFallbackTimer = null;
  let sseQueue = [], sseTimer = null; // 流式节流：50ms 批量 flush（防超长流卡死）
  function sseFlush() {
    sseTimer = null;
    if (!sseQueue.length) return;
    const batch = sseQueue;
    sseQueue = [];
    renderBatch = true;
    for (const s of batch) applyStep(s);
    renderBatch = false;
    scrollDown();
  }
  function startSyncFallback() {
    if (syncFallbackTimer) return;
    syncFallbackTimer = setInterval(() => {
      if (currentId && ssFail >= 2) {
        // SSE 疑似被网络掐断：降级为定时拉取历史（merge 增量 + seenSeqs 去重）
        loadHistory(currentId, true);
      }
    }, 12000);
  }
  function syncAlive() { ssFail = 0; }

  async function openChat(id, title) {
    currentId = id; seenSeqs = new Set(); curMsg = null; curThinking = null;
    lastSeqMax = 0; renderBatch = false;
    ssFail = 0;
    threadName.textContent = title || id;
    modelBadge.disabled = false;
    if (es) { es.close(); es = null; }
    thread.innerHTML = '<div class="day-note">加载中…</div>';
    await loadHistory(id);
    connectStream(id);
    refreshBalance();
    startSyncFallback();
  }

  function connectStream(id) {
    if (es) { try { es.close(); } catch {} es = null; }
    ssFail = 0;
    const url = apiBase() + "/threads/" + encodeURIComponent(id) + "/stream" + qs();
    const open = () => {
      es = new EventSource(url);
      const alive = () => { syncAlive(); };
      es.addEventListener("status", (e) => {
        alive();
        try { const d = JSON.parse(e.data); if (d.status === "connected") loadHistory(id, true); } catch {}
      });
      es.addEventListener("meta", (e) => {
        alive();
        try {
          const d = JSON.parse(e.data);
          if (d.title) threadName.textContent = d.title;
          if (d.model) setModelBadge(d.model);
        } catch {}
      });
      es.addEventListener("step", (e) => {
        alive();
        try {
          // 流式节流：chunk 先进队列，50ms 批量 flush 一次——超长流逐 chunk
          // applyStep + scrollDown 会拖垮 Android WebView 主线程（曾实测卡死）
          const s = JSON.parse(e.data);
          sseQueue.push(s);
          if (!sseTimer) sseTimer = setTimeout(sseFlush, 50);
        } catch {}
      });
      es.onerror = () => {
        ssFail++;
        try { es.close(); } catch {}
        es = null;
        // 自动重连（最多 10 次，之后交给 12s 历史兜底轮询）
        if (ssFail < 10 && currentId === id) setTimeout(open, 3000);
      };
    };
    open();
  }

  // ---------- 发送 / 停止 ----------
  const composer = document.getElementById("composer");
  composer.addEventListener("submit", (e) => { e.preventDefault(); send(); });
  sendBtn.onclick = (e) => {
    if (busy) stop();
    else send();
  };

  async function send() {
    const text = textareaEl.value.trim();
    if ((!text && !attachments.some(a => a.status === "ok")) || !currentId || busy) return;
    const um = document.createElement("div");
    um.className = "message user";
    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = "我";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text || "";
    const okAtt = attachments.filter(a => a.status === "ok");
    if (okAtt.length) {
      const note = document.createElement("div");
      note.className = "attach-note";
      for (const a of okAtt) {
        const sp = document.createElement("span");
        sp.textContent = (a.isImage ? "🖼 " : "📎 ") + a.name;
        note.appendChild(sp);
      }
      bubble.appendChild(note);
    }
    wrap.append(meta, bubble);
    um.appendChild(wrap);
    um.classList.add("msg-in");
    thread.appendChild(um);
    textareaEl.value = ""; textareaEl.style.height = "auto";
    curMsg = null; curThinking = null;
    setBusy(true);
    scrollDown();
    try {
      const body = { text: text || "（附件）", attachments: okAtt.map(a => ({ name: a.name, path: a.path })) };
      const r = await fetch(apiBase() + "/threads/" + encodeURIComponent(currentId) + "/send", {
        method: "POST", headers: Object.assign({}, authHeader(), { "Content-Type": "application/json" }),
        body: JSON.stringify(body),
      });
      if (!r.ok) { setBusy(false); showNotice("发送失败：HTTP " + r.status, true); }
      else { attachments = []; renderAttachmentChips(); }
    } catch (err) { setBusy(false); showNotice("发送失败：" + err.message, true); }
  }

  async function stop() {
    if (!currentId) return;
    try {
      await fetch(apiBase() + "/threads/" + encodeURIComponent(currentId) + "/stop", { method: "POST", headers: authHeader() });
    } catch {}
  }

  // ---------- 列表刷新 ----------
  async function loadThreads() {
    try {
      const r = await fetch(apiBase() + "/threads", { headers: authHeader() });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const { threads: list } = await r.json();
      threads = list || [];
      renderThreadMenu();
      const hasLive = threads.some(t => t.live);
      document.body.classList.toggle("dot-blue", hasLive && !busy);
      if (hasLive) document.body.classList.toggle("dot-flashing", busy);
      else document.body.classList.remove("dot-flashing");
    } catch (e) {
      showNotice("连接失败：" + e.message, true);
    }
  }
  setInterval(loadThreads, 15000);
  setInterval(() => { if (currentId) refreshBalance(); }, 60000);

  // ---------- notice ----------
  let noticeTimer = null;
  function showNotice(msg, isError) {
    dayNote.textContent = (isError ? "⚠ " : "") + msg;
    dayNote.style.color = isError ? "#ff8d8d" : "var(--faint)";
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => {
      dayNote.textContent = currentId ? "" : "选择或新建一个 DSH 会话";
      dayNote.style.color = "var(--faint)";
    }, 4000);
  }

  // ---------- 扫码连接（系统相机拍照 → jsQR 解码） ----------
  function applyQrText(text) {
    let u;
    try { u = new URL(String(text).trim()); } catch { showNotice("二维码内容不是有效链接", true); return; }
    if (u.protocol === "http:" || u.protocol === "https:") {
      localStorage.setItem(LS_URL, u.origin + "/dsh-mini/api");
      const t = u.searchParams.get("token");
      if (t) localStorage.setItem(LS_TOKEN, t);
      else localStorage.removeItem(LS_TOKEN);
      closeSettings();
      loadThreads();
      showNotice("已连接 " + u.host, false);
    } else {
      showNotice("暂不支持该二维码类型（仅支持 http(s) 连接链接）", true);
    }
  }
  async function scanQrConnect(file) {
    try {
      if (typeof jsQR !== "function") throw new Error("扫码库未加载");
      const bmp = await createImageBitmap(file);
      const W = Math.min(bmp.width, 1400);
      const scale = W / bmp.width;
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = Math.max(1, Math.round(bmp.height * scale));
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imgData.data, canvas.width, canvas.height);
      if (!code || !code.data) { showNotice("未识别到二维码，请对准桌面二维码重拍", true); return; }
      applyQrText(code.data);
    } catch (e) {
      showNotice("扫码失败：" + (e && e.message ? e.message : e), true);
    }
  }
  scanInput.onchange = () => {
    const f = scanInput.files && scanInput.files[0];
    scanInput.value = "";
    if (f) scanQrConnect(f);
  };

  // ---------- 设置 ----------
  const settingsCard = document.createElement("div");
  settingsCard.className = "thread-menu";
  settingsCard.id = "settings-card";
  settingsCard.style.display = "none";
  settingsCard.style.position = "fixed";
  settingsCard.style.left = "12px";
  settingsCard.style.top = "calc(max(0px, calc(max(env(safe-area-inset-top), var(--dsh-safe-top)) - var(--topbar-safe-lift))) + var(--topbar-row-height) + 8px)";
  settingsCard.style.zIndex = "30";
  settingsCard.innerHTML =
    '<div class="thread-section-label">连接设置</div>' +
    '<input id="cfg-url" placeholder="http://192.168.x.x:端口/dsh-mini/api" style="width:100%;min-height:42px;border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:0 12px;background:rgba(0,0,0,.32);color:var(--text);font:inherit;font-size:15px;outline:none;margin-bottom:8px" />' +
    '<input id="cfg-token" placeholder="桥接 Token（非本机访问需要）" style="width:100%;min-height:42px;border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:0 12px;background:rgba(0,0,0,.32);color:var(--text);font:inherit;font-size:15px;outline:none;margin-bottom:10px" />' +
    '<div class="scan-btn-row">' +
    '<button class="thread-menu-btn" id="cfg-scan" style="margin-top:0;text-align:center;grid-template-columns:1fr;color:#8ef0b7;background:rgba(142,240,183,.12)">📷 扫码连接</button>' +
    '<button class="thread-menu-btn" id="cfg-paste" style="margin-top:0;text-align:center;grid-template-columns:1fr">📋 粘贴链接</button>' +
    "</div>" +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">' +
    '<button class="thread-menu-btn" id="cfg-cancel" style="margin-top:0;text-align:center;grid-template-columns:1fr">取消</button>' +
    '<button class="thread-menu-btn" id="cfg-save" style="margin-top:0;text-align:center;grid-template-columns:1fr;color:#5eb4ff;background:rgba(94,180,255,.12)">保存</button>' +
    "</div>";
  document.body.appendChild(settingsCard);
  function openSettings() {
    document.getElementById("cfg-url").value = localStorage.getItem(LS_URL) || "";
    document.getElementById("cfg-token").value = localStorage.getItem(LS_TOKEN) || "";
    settingsCard.style.display = "block";
  }
  function closeSettings() { settingsCard.style.display = "none"; }
  settingsBtn.onclick = openSettings;
  document.getElementById("cfg-cancel").onclick = closeSettings;
  document.getElementById("cfg-scan").onclick = () => { settingsCard.style.display = "none"; scanInput.click(); };
  document.getElementById("cfg-paste").onclick = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) applyQrText(text);
      else showNotice("剪贴板为空", true);
    } catch (e) {
      showNotice("无法读取剪贴板，请手动填写", true);
    }
  };
  document.getElementById("cfg-save").onclick = () => {
    localStorage.setItem(LS_URL, document.getElementById("cfg-url").value.trim());
    localStorage.setItem(LS_TOKEN, document.getElementById("cfg-token").value.trim());
    closeSettings();
    loadThreads();
  };

  // ---------- 输入 ----------
  textareaEl.addEventListener("input", () => { textareaEl.style.height = "auto"; textareaEl.style.height = Math.min(textareaEl.scrollHeight, 130) + "px"; });
  textareaEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

  // ---------- 键盘弹起 ----------
  // vv.height 随键盘缩小而 innerHeight 不变 → shift = innerHeight - vv.height（
  // 旧实现写反：vv.height - innerHeight 在 overlays-content 下恒负 → 永不位移）。
  // 位移叠加底部安全区；WebView 不触发 vv 事件时 window.resize 兜底。
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const safeBottom = () => {
      const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dsh-safe-bottom") || "0");
      return Number.isFinite(v) ? v : 0;
    };
    const onVp = () => {
      const shift = Math.max(0, window.innerHeight - vv.height + safeBottom());
      document.body.classList.toggle("keyboard-open", shift > 80);
      document.documentElement.style.setProperty("--keyboard-shift", (shift > 80 ? shift : 0) + "px");
    };
    vv.addEventListener("resize", onVp);
    vv.addEventListener("scroll", onVp);
    window.addEventListener("resize", onVp);
  }
  textareaEl.addEventListener("focus", () => {
    document.body.classList.add("keyboard-open");
    setTimeout(() => { try { textareaEl.scrollIntoView({ block: "nearest" }); } catch {} }, 200);
  });
  textareaEl.addEventListener("blur", () => {
    document.body.classList.remove("keyboard-open");
    document.documentElement.style.removeProperty("--keyboard-shift");
  });

  // ---------- 启动 ----------
  (function boot() {
    if (navigator.standalone || matchMedia("(display-mode: standalone)").matches) document.body.classList.add("standalone");
    loadThreads();
  })();

  </script>

</body>
</html>
